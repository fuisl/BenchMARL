# M4 latent world-model baselines. One shared starting configuration for all
# three predictors: only `model.kind` changes between them, so any difference is
# attributable to the conditioning structure rather than to capacity or budget.
seed: 4100
device: cuda
loggers: [csv, wandb]

wandb:
  project: counterfactual-wm
  entity: cair-traffic

data:
  root: outputs/transport_data_1190
  regime: correlated
  action_block: 5
  # Stage 2 (audit 2026-09-15 section 9): what the encoder is shown.
  #   observation  what the agents actually see -- the baseline
  #   history      the last `history_frames` observed frames, so hidden state
  #                can be inferred from motion rather than supplied
  #   physical     recorded entity states appended outright, the upper bound
  state_input: observation
  history_frames: 3

model:
  # Historical checkpoints omit this field and load as legacy_compact.
  # lewm_reference is a parallel Audit-Gate-A0 profile; it never changes the
  # module graph used by those checkpoints.
  profile: legacy_compact  # legacy_compact | lewm_reference
  kind: relational  # independent | joint | relational
  dim: 192          # LeWM embed_dim
  hidden_dim: 512
  # Shared conditioner capacity budget, so `independent`, `joint` and
  # `relational` have equal dynamics parameter counts and a difference between
  # them cannot be attributed to one model simply being larger. null = use
  # hidden_dim for all three (unmatched).
  conditioner_budget: 1083072
  depth: 4
  heads: 8
  dim_head: 32
  mlp_dim: 512
  dropout: 0.0
  # Used only by lewm_reference.
  history_size: 3
  projector_hidden_dim: 2048

train:
  batch_size: 128       # LeWM loader.batch_size
  dynamics_epochs: 100  # LeWM trainer.max_epochs
  readout_epochs: 50
  learning_rate: 5.0e-5 # LeWM optimizer.lr
  weight_decay: 1.0e-3  # LeWM optimizer.weight_decay
  gradient_clip: 1.0    # LeWM trainer.gradient_clip_val
  sigreg_weight: 0.09   # LeWM loss.sigreg.weight
  sigreg_knots: 17
  sigreg_projections: 1024
  # Historical reproduction. The reference profile overrides this with a
  # population that preserves time as LeWM does.
  sigreg_population: legacy_flattened

hydra:
  run:
    dir: outputs/m4_${model.kind}_${data.regime}
