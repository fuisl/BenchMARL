# Audit Gate A0.1: vector-input, reference-compatible LeWM profile.
# The vector encoder and multi-agent conditioner are explicit adaptations; the
# temporal width, predictor, projector and optimizer recipe match the pinned
# LeWM contract. Real planner history and the registered multi-agent SIGReg
# population semantics are implemented by A0 step 2. Action statistics are
# fitted only on valid training rows and applied at the model boundary.
defaults:
  - world_model
  - _self_

model:
  profile: lewm_reference
  dim: 192
  depth: 6
  heads: 16
  dim_head: 64
  mlp_dim: 2048
  dropout: 0.1
  history_size: 3
  projector_hidden_dim: 2048

data:
  # This is one independently encoded frame, not the legacy concatenated
  # state_input=history representation.
  state_input: observation
  history_frames: 3

train:
  batch_size: 128
  dynamics_epochs: 100
  learning_rate: 5.0e-5
  weight_decay: 1.0e-3
  gradient_clip: 1.0
  sigreg_weight: 0.09
  sigreg_knots: 17
  sigreg_projections: 1024
  # (T,B*N,D): agents are additional population members at each time index.
  # `per_agent` is the registered diagnostic alternative, never selected
  # post-hoc from control results.
  sigreg_population: joint
  # Pinned LeWM asks for interval "epoch", but stable-pretraining v0.1.7 runs
  # with automatic_optimization disabled and steps the scheduler itself after
  # every optimizer update, so that interval is never acted on. Per-update
  # stepping is therefore the reference cadence. Its factory defaults are
  # max(1, floor(1% of total updates)) warmup, zero start LR and zero eta_min.

hydra:
  run:
    dir: outputs/a0_reference_${model.kind}_${data.regime}
