# @package hydra.launcher
_target_: hydra_plugins.benchmarl_packed_launcher.PackedSlurmLauncher

# Tuned for the local single-node dev cluster on gpu-a240 (`sinfo`/`scontrol
# show partition` there report partition `gpu`; `scontrol show node` lists
# gres `gpu:a100`, `gpu:a100_3g.20gb`, `gpu:a100_2g.10gb`, and
# `gpu:a100_2g.10gb_mps`, see /etc/slurm/gres.conf). This box is not
# resource-constrained for this project, so this targets the larger 3g.20gb
# MIG (42 SMs/20GB vs. 28 SMs/10GB on the 2g.10gb slice) and a generous share
# of the node's 32 CPUs / ~84GB RAM, while still going through MIG rather
# than the full A100 so allocations stay isolated and schedulable alongside
# other work (see coding_rules.md). A different single-node box will have
# different partition/gres names and headroom; check `sinfo`/`scontrol show
# node` there and adjust.
submitit_folder: ${hydra.sweep.dir}/.submitit/%j
partition: gpu
gres: gpu:a100_3g.20gb:1
account: null
qos: null
timeout_min: 120

total_cpus: 16
mem_gb: 48
max_migs: 1
one_mig_threshold: 16
max_workers_per_mig: 8
policy: balanced

name: ${hydra.job.name}
array_parallelism: 1
signal_delay_s: 120
additional_parameters: {}
setup: null
