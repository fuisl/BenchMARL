
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmarl"
version = "1.5.2"
description = "BenchMARL"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Matteo Bettini", email = "mb2389@cl.cam.ac.uk" },
]
dependencies = [
    "av<14",
    "hydra-core",
    "hydra-joblib-launcher>=1.2,<1.3",
    "hydra-submitit-launcher>=1.2,<1.3",
    "numpy",
    "torchrl>=0.10,<0.12",
    "torchvision",
    "tqdm",
]

[project.optional-dependencies]
vmas = ["vmas>=1.3.4"]
pettingzoo = ["pettingzoo[all]>=1.24.3"]
meltingpot = ["dm-meltingpot"]
gnn = ["torch-geometric"]
logging = ["moviepy", "wandb"]

[tool.uv]
package = true
constraint-dependencies = [
    "numpy<2",
    "torch==2.7.1",
    "torchrl==0.11.0",
    "torchvision==0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
